name: Publish

# Publishing a GitHub release publishes the package to npm and then lists that
# version in the MCP Registry. Running the workflow by hand only updates the
# MCP Registry (for a version that is already on npm).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:run

      - name: Publish to npm
        run: npm publish --provenance --access public

  registry:
    name: Publish to the MCP Registry
    # The registry only stores metadata and checks the package on npm, so npm must come first.
    # A failure here does not undo the npm release; this job can be run again on its own.
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # GitHub OIDC proves that this repository owns the io.github.remem-mcp/* names

    env:
      # Pinned on purpose; update it deliberately, never use "latest"
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - uses: actions/checkout@v4

      - name: Use the version from package.json
        run: |
          version="$(jq -r .version package.json)"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp
          mv server.tmp server.json
          cat server.json

      - name: Wait until the version is available on npm
        run: |
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          for attempt in $(seq 1 12); do
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              exit 0
            fi
            echo "Waiting for $name@$version to appear on npm (attempt $attempt)"
            sleep 10
          done
          echo "::error::$name@$version is not on npm, so it cannot be listed in the MCP Registry"
          exit 1

      - name: Download mcp-publisher
        run: |
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          tar xzf "$archive" mcp-publisher

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
